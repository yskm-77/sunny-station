<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阳光驿站留言板</title>
<style>
  body {
    font-family: "Microsoft YaHei", Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
    color: #333;
  }
  .box {
    max-width: 700px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #ddd;
    padding: 24px;
  }
  h1 {
    text-align: center;
    font-size: 26px;
    margin: 0 0 6px 0;
  }
  .sub {
    text-align: center;
    color: #888;
    font-size: 13px;
    margin: 0 0 20px 0;
  }
  p {
    font-size: 14px;
    line-height: 1.8;
  }
  h2 {
    font-size: 18px;
    border-left: 4px solid #4a90d9;
    padding-left: 8px;
    margin: 28px 0 12px 0;
  }
  label {
    display: block;
    font-size: 14px;
    margin-bottom: 4px;
  }
  input, select, textarea {
    width: 100%;
    box-sizing: border-box;
    padding: 8px;
    border: 1px solid #ccc;
    font-size: 14px;
    margin-bottom: 14px;
  }
  textarea {
    height: 110px;
    resize: vertical;
  }
  button {
    background: #4a90d9;
    color: #fff;
    border: none;
    padding: 10px 24px;
    font-size: 15px;
    cursor: pointer;
  }
  button:hover {
    background: #3a7cbd;
  }
  .count {
    font-size: 12px;
    color: #999;
    margin-top: -10px;
    margin-bottom: 14px;
  }
  .item {
    border: 1px solid #e5e5e5;
    padding: 10px 12px;
    margin-bottom: 10px;
    background: #fafafa;
  }
  .item .name {
    font-weight: bold;
    font-size: 14px;
  }
  .item .time {
    color: #999;
    font-size: 12px;
    margin-left: 8px;
  }
  .item .text {
    font-size: 14px;
    margin: 6px 0;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .item .cat {
    color: #4a90d9;
    font-size: 12px;
  }
  .item .del {
    color: #d9534f;
    font-size: 12px;
    cursor: pointer;
    float: right;
  }
  .footer {
    text-align: center;
    color: #aaa;
    font-size: 12px;
    margin-top: 30px;
  }
</style>
</head>
<body>
<div class="box">

  <h1>阳光驿站留言板</h1>
  <p class="sub">心理专属空间 · Web 开发活动</p>

  <p>这里是阳光驿站的留言板，大家可以给驿站提建议：想参加什么活动、希望增加什么服务、对空间布置有什么想法，都可以写在这里。</p>
  <p>留言只保存在你自己的浏览器里，不会上传到服务器。</p>

  <h2>写留言</h2>

  <form id="form">
    <label>昵称（可以不填）</label>
    <input type="text" id="name" maxlength="12" placeholder="例如：小明">

    <label>类别</label>
    <select id="cat">
      <option value="活动建议">活动建议</option>
      <option value="空间与环境">空间与环境</option>
      <option value="内容与选题">内容与选题</option>
      <option value="其他">其他</option>
    </select>

    <label>留言内容</label>
    <textarea id="text" maxlength="300" placeholder="写点什么吧……"></textarea>
    <div class="count"><span id="count">0</span> / 300</div>

    <button type="submit">提交留言</button>
  </form>

  <h2>大家的留言（<span id="total">0</span> 条）</h2>
  <div id="list"></div>

  <div class="footer">计算机科学与技术学院 · 阳光驿站</div>
</div>

<script>
  var list = document.getElementById("list");
  var total = document.getElementById("total");
  var input = document.getElementById("text");
  var count = document.getElementById("count");

  var messages = JSON.parse(localStorage.getItem("sunny_messages") || "[]");

  function render() {
    list.innerHTML = "";
    total.innerHTML = messages.length;

    if (messages.length === 0) {
      list.innerHTML = "<p style='color:#999;font-size:14px'>还没有留言，快来写第一条吧。</p>";
      return;
    }

    for (var i = 0; i < messages.length; i++) {
      var m = messages[i];
      var div = document.createElement("div");
      div.className = "item";

      var del = document.createElement("span");
      del.className = "del";
      del.innerHTML = "删除";
      (function (id) {
        del.onclick = function () {
          if (!confirm("确定删除这条留言吗？")) return;
          messages = messages.filter(function (x) { return x.id !== id; });
          localStorage.setItem("sunny_messages", JSON.stringify(messages));
          render();
        };
      })(m.id);

      var name = document.createElement("span");
      name.className = "name";
      name.textContent = m.name || "匿名";

      var time = document.createElement("span");
      time.className = "time";
      time.innerHTML = m.time;

      var text = document.createElement("div");
      text.className = "text";
      text.textContent = m.text;

      var cat = document.createElement("span");
      cat.className = "cat";
      cat.textContent = m.cat;

      div.appendChild(del);
      div.appendChild(name);
      div.appendChild(time);
      div.appendChild(text);
      div.appendChild(cat);
      list.appendChild(div);
    }
  }

  document.getElementById("form").onsubmit = function (e) {
    e.preventDefault();

    var text = input.value.trim();
    if (text === "") {
      alert("留言内容不能为空");
      return;
    }

    var d = new Date();
    var time = d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate() +
               " " + d.getHours() + ":" + d.getMinutes();

    messages.unshift({
      id: Date.now(),
      name: document.getElementById("name").value.trim(),
      cat: document.getElementById("cat").value,
      text: text,
      time: time
    });

    localStorage.setItem("sunny_messages", JSON.stringify(messages));

    document.getElementById("form").reset();
    count.innerHTML = "0";
    render();
  };

  input.oninput = function () {
    count.innerHTML = input.value.length;
  };

  render();
</script>
</body>
</html>
